[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --tracing=retain-on-failure
    --screenshot=only-on-failure

markers =
    ui: browser-based end-to-end tests
    api: HTTP-level tests that do not open a browser
    smoke: fast subset suitable for a pull request gate
    regression: broader coverage of secondary flows
    data: validation of the Excel test-data workbook

filterwarnings =
    default

timeout = 120
timeout_method = thread

log_cli_level = INFO
